name: Draft Release
run-name: Draft v${{ inputs.version }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer without the v prefix
        required: true
        type: string
      published_at:
        description: UTC RFC 3339 timestamp such as 2026-08-28T12:34:56Z
        required: true
        type: string
      runtime_catalog_sequence:
        description: Monotonically increasing Runtime Catalog sequence
        required: true
        type: string
      runtime_catalog_expires_at:
        description: Runtime Catalog expiry as a UTC RFC 3339 timestamp
        required: true
        type: string
      confirm_repackage:
        description: Type REPACKAGE v followed by the version
        required: true
        type: string
      confirm_draft:
        description: Type DRAFT v followed by the version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: draft-release-v${{ inputs.version }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.22.0"

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.version }}
      PUBLISHED_AT: ${{ inputs.published_at }}
      RUNTIME_CATALOG_SEQUENCE: ${{ inputs.runtime_catalog_sequence }}
      RUNTIME_CATALOG_EXPIRES_AT: ${{ inputs.runtime_catalog_expires_at }}
      CONFIRM_REPACKAGE: ${{ inputs.confirm_repackage }}
      CONFIRM_DRAFT: ${{ inputs.confirm_draft }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate manual confirmations
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Stable release version must be SemVer without a prerelease suffix" >&2
            exit 1
          fi
          if [[ ! "$PUBLISHED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "Published time must use UTC RFC 3339 seconds" >&2
            exit 1
          fi
          if [[ ! "$RUNTIME_CATALOG_SEQUENCE" =~ ^[1-9][0-9]*$ ]] ||
            (( RUNTIME_CATALOG_SEQUENCE > 9007199254740991 )); then
            echo "Runtime Catalog sequence must be a safe positive JSON integer" >&2
            exit 1
          fi
          if [[ ! "$RUNTIME_CATALOG_EXPIRES_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "Runtime Catalog expiry must use UTC RFC 3339 seconds" >&2
            exit 1
          fi
          if [[ "$CONFIRM_REPACKAGE" != "REPACKAGE v$VERSION" ]]; then
            echo "Repackage confirmation does not match REPACKAGE v$VERSION" >&2
            exit 1
          fi
          if [[ "$CONFIRM_DRAFT" != "DRAFT v$VERSION" ]]; then
            echo "Draft confirmation does not match DRAFT v$VERSION" >&2
            exit 1
          fi

      - name: Check out the existing release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and release state
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
          git tag --points-at HEAD --list "$tag" | grep -Fx "$tag"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $tag" >&2
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify project metadata and release tests
        shell: bash
        run: |
          set -euo pipefail
          root_version="$(node -p "require('./package.json').version")"
          desktop_version="$(node -p "require('./apps/desktop/package.json').version")"
          tauri_version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          cargo_version="$(awk '/^\[workspace.package\]$/ { section = 1; next } section && /^version = / { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)"
          test "$VERSION" = "$root_version"
          test "$VERSION" = "$desktop_version"
          test "$VERSION" = "$tauri_version"
          test "$VERSION" = "$cargo_version"
          node --test scripts/generate-app-release-manifest.test.mjs

  build-windows:
    name: Build Windows x64 Community installer
    needs:
      - validate
      - build-windows-online-runtimes
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out the existing release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Windows online Runtime assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: draft-windows-online-runtimes
          path: release-input/runtimes

      - name: Run frontend tests
        run: pnpm -r --if-present test

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Prepare Desktop sidecars
        run: node scripts/build-desktop-bundle-assets.mjs

      - name: Prepare bundled Windows Runtimes
        shell: pwsh
        run: ./scripts/prepare-windows-runtimes.ps1

      - name: Build verified online PHP Runtime
        shell: pwsh
        run: ./scripts/build-windows-php-runtime.ps1 -OutputDirectory release-input

      - name: Validate packaged Windows PHP Runtime installation
        env:
          FABDEV_WINDOWS_PHP74_RUNTIME_PACKAGE: ${{ github.workspace }}/release-input/php-7.4.33-windows-x64-community.tar.gz
          FABDEV_WINDOWS_PHP82_RUNTIME_PACKAGE: ${{ github.workspace }}/release-input/php-8.2.33-windows-x64-community.tar.gz
          FABDEV_WINDOWS_PHP84_RUNTIME_PACKAGE: ${{ github.workspace }}/release-input/php-8.4.24-windows-x64-community.tar.gz
        run: >-
          cargo test -p fabdev-runtime installs_real_windows_php_archive
          --target x86_64-pc-windows-msvc -- --ignored

      - name: Validate packaged Windows Node.js and MariaDB Runtime installation
        env:
          FABDEV_WINDOWS_NODE20_RUNTIME_PACKAGE: ${{ github.workspace }}/release-input/runtimes/node-20.20.2-windows-x64.tar.gz
          FABDEV_WINDOWS_NODE24_RUNTIME_PACKAGE: ${{ github.workspace }}/release-input/runtimes/node-24.20.0-windows-x64.tar.gz
          FABDEV_WINDOWS_MARIADB_RUNTIME_PACKAGE: ${{ github.workspace }}/release-input/runtimes/mariadb-12.3.2-windows-x64.tar.gz
        run: >-
          cargo test -p fabdev-agent installs_real_windows_online_service_runtime_archives
          --target x86_64-pc-windows-msvc -- --ignored

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-msvc

      - name: Build fabDev Connect
        run: cargo build -p fabdev-connect --release --target x86_64-pc-windows-msvc

      - name: Build unsigned NSIS installer
        run: pnpm --filter @fabdev/desktop exec tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows.conf.json

      - name: Stage Windows assets
        shell: pwsh
        run: |
          $installers = @(
            Get-ChildItem -Path "target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" -File
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }
          New-Item -ItemType Directory -Force -Path "release-input" | Out-Null
          Copy-Item $installers[0].FullName "release-input/windows-installer.exe"
          Copy-Item "target/x86_64-pc-windows-msvc/release/fabdev-connect.exe" "release-input/fabdev-connect.exe"

      - name: Upload Windows assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draft-windows-x64
          path: |
            release-input/windows-installer.exe
            release-input/fabdev-connect.exe
            release-input/php-7.4.33-windows-x64-community.tar.gz
            release-input/php-8.2.33-windows-x64-community.tar.gz
            release-input/php-8.4.24-windows-x64-community.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-windows-online-runtimes:
    name: Build verified Windows x64 Node.js and MariaDB Runtimes
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the existing release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build verified Runtime packages
        shell: bash
        env:
          FABDEV_BUILD_ROOT: ${{ runner.temp }}/windows-runtime-packages
          FABDEV_ARTIFACT_DIR: ${{ github.workspace }}/release-input/runtimes
          FABDEV_WINDOWS_RUNTIME_NAMES: mariadb node
        run: ./scripts/build-windows-runtime-packages.sh

      - name: Upload Runtime packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draft-windows-online-runtimes
          path: |
            release-input/runtimes/mariadb-12.3.2-windows-x64.tar.gz
            release-input/runtimes/node-20.20.2-windows-x64.tar.gz
            release-input/runtimes/node-24.20.0-windows-x64.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  create-draft:
    name: Create GitHub Draft Release
    needs:
      - validate
      - build-windows
      - build-windows-online-runtimes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      PUBLISHED_AT: ${{ inputs.published_at }}
      RUNTIME_CATALOG_SEQUENCE: ${{ inputs.runtime_catalog_sequence }}
      RUNTIME_CATALOG_EXPIRES_AT: ${{ inputs.runtime_catalog_expires_at }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the existing release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Download Windows assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: draft-windows-x64
          path: release-input/windows

      - name: Download Windows online Runtime assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: draft-windows-online-runtimes
          path: release-input/runtimes

      - name: Generate release assets and manifests
        shell: bash
        run: |
          node scripts/generate-app-release-manifest.mjs \
            --version "$VERSION" \
            --published-at "$PUBLISHED_AT" \
            --output-dir "$GITHUB_WORKSPACE/release-assets" \
            --windows-x64 "$GITHUB_WORKSPACE/release-input/windows/windows-installer.exe" \
            --windows-connect-x64 "$GITHUB_WORKSPACE/release-input/windows/fabdev-connect.exe" \
            --runtime-php74-windows-x64 "$GITHUB_WORKSPACE/release-input/windows/php-7.4.33-windows-x64-community.tar.gz" \
            --runtime-php82-windows-x64 "$GITHUB_WORKSPACE/release-input/windows/php-8.2.33-windows-x64-community.tar.gz" \
            --runtime-windows-x64 "$GITHUB_WORKSPACE/release-input/windows/php-8.4.24-windows-x64-community.tar.gz" \
            --runtime-mariadb-windows-x64 "$GITHUB_WORKSPACE/release-input/runtimes/mariadb-12.3.2-windows-x64.tar.gz" \
            --runtime-node20-windows-x64 "$GITHUB_WORKSPACE/release-input/runtimes/node-20.20.2-windows-x64.tar.gz" \
            --runtime-node24-windows-x64 "$GITHUB_WORKSPACE/release-input/runtimes/node-24.20.0-windows-x64.tar.gz"
          cargo run --locked -p fabdev-runtime --bin fabdev-runtime-catalog -- \
            generate-windows \
            "$VERSION" \
            "$RUNTIME_CATALOG_SEQUENCE" \
            "$PUBLISHED_AT" \
            "$RUNTIME_CATALOG_EXPIRES_AT" \
            "$VERSION" \
            "$GITHUB_WORKSPACE/release-assets/php-7.4.33-windows-x64-community.tar.gz" \
            "$GITHUB_WORKSPACE/release-assets/php-8.2.33-windows-x64-community.tar.gz" \
            "$GITHUB_WORKSPACE/release-assets/php-8.4.24-windows-x64-community.tar.gz" \
            "$GITHUB_WORKSPACE/release-assets/mariadb-12.3.2-windows-x64-community.tar.gz" \
            "$GITHUB_WORKSPACE/release-assets/node-20.20.2-windows-x64-community.tar.gz" \
            "$GITHUB_WORKSPACE/release-assets/node-24.20.0-windows-x64-community.tar.gz" \
            "$GITHUB_WORKSPACE/release-assets/fabdev-runtime-v1.json"
          cargo run --locked -p fabdev-runtime --bin fabdev-runtime-catalog -- \
            validate \
            "$GITHUB_WORKSPACE/release-assets/fabdev-runtime-v1.json" \
            "$VERSION"
          (
            cd release-assets
            sha256sum --check SHA256SUMS
            test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = "20"
          )

      - name: Create release notes skeleton
        shell: bash
        run: |
          {
            printf '# fabDev %s\n\n' "$VERSION"
            printf '> Draft only - do not publish before clean-machine acceptance.\n\n'
            printf '## Unsigned Community Build\n\n'
            printf 'This Windows-only build does not use Windows Code Signing.\n\n'
            printf 'Verify the downloaded installer against SHA256SUMS before installation.\n\n'
            printf '## Release checklist\n\n'
            printf -- '- [ ] Complete release notes and known limitations.\n'
            printf -- '- [ ] Verify Windows x64 clean install, update, demo.test, and removal.\n'
            printf -- '- [ ] Re-download every Draft asset and verify size and SHA-256.\n'
            printf -- '- [ ] Validate the Windows PHP 7.4.33/8.2.33/8.4.24, MariaDB 12.3.2, and Node.js 20.20.2/24.20.0 Runtime Archives and Runtime Catalog v1.\n'
            printf -- '- [ ] Verify side-by-side Runtime install and update without changing current PHP or Sites.\n'
            printf -- '- [ ] Obtain explicit Repository Owner approval before Publish.\n'
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create Draft Release
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          existing_release_id="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$tag\") | .id"
          )"
          if [[ -n "$existing_release_id" ]]; then
            echo "A GitHub Release already exists for $tag" >&2
            exit 1
          fi
          gh release create "$tag" "$GITHUB_WORKSPACE/release-assets/"* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --latest=false \
            --title "fabDev $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          test "$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$tag\") | .draft"
          )" = "true"
