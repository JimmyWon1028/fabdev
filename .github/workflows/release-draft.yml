name: Draft Release
run-name: Draft v${{ inputs.version }} (${{ inputs.release_scope }}) from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_scope:
        description: Platforms to build for this Draft
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - macos
      version:
        description: Stable SemVer without the v prefix
        required: true
        type: string
      published_at:
        description: UTC RFC 3339 timestamp such as 2026-08-28T12:34:56Z
        required: true
        type: string
      runtime_catalog_sequence:
        description: Monotonically increasing Runtime Catalog sequence
        required: true
        type: string
      runtime_catalog_expires_at:
        description: Runtime Catalog expiry as a UTC RFC 3339 timestamp
        required: true
        type: string
      confirm_repackage:
        description: Type REPACKAGE v followed by the version
        required: true
        type: string
      confirm_draft:
        description: Type DRAFT v followed by the version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: draft-release-v${{ inputs.version }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.22.0"

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_SCOPE: ${{ inputs.release_scope }}
      PUBLISHED_AT: ${{ inputs.published_at }}
      RUNTIME_CATALOG_SEQUENCE: ${{ inputs.runtime_catalog_sequence }}
      RUNTIME_CATALOG_EXPIRES_AT: ${{ inputs.runtime_catalog_expires_at }}
      CONFIRM_REPACKAGE: ${{ inputs.confirm_repackage }}
      CONFIRM_DRAFT: ${{ inputs.confirm_draft }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate manual confirmations
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Stable release version must be SemVer without a prerelease suffix" >&2
            exit 1
          fi
          if [[ "$RELEASE_SCOPE" != "all" && "$RELEASE_SCOPE" != "windows" && "$RELEASE_SCOPE" != "macos" ]]; then
            echo "Release scope must be all, windows, or macos" >&2
            exit 1
          fi
          if [[ ! "$PUBLISHED_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "Published time must use UTC RFC 3339 seconds" >&2
            exit 1
          fi
          if [[ ! "$RUNTIME_CATALOG_SEQUENCE" =~ ^[1-9][0-9]*$ ]] ||
            (( RUNTIME_CATALOG_SEQUENCE > 9007199254740991 )); then
            echo "Runtime Catalog sequence must be a safe positive JSON integer" >&2
            exit 1
          fi
          if [[ ! "$RUNTIME_CATALOG_EXPIRES_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "Runtime Catalog expiry must use UTC RFC 3339 seconds" >&2
            exit 1
          fi
          if [[ "$CONFIRM_REPACKAGE" != "REPACKAGE v$VERSION" ]]; then
            echo "Repackage confirmation does not match REPACKAGE v$VERSION" >&2
            exit 1
          fi
          if [[ "$CONFIRM_DRAFT" != "DRAFT v$VERSION" ]]; then
            echo "Draft confirmation does not match DRAFT v$VERSION" >&2
            exit 1
          fi

      - name: Check out the existing release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and release state
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
          git tag --points-at HEAD --list "$tag" | grep -Fx "$tag"
          mapfile -t existing_releases < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$tag\") | [.id, .draft, .prerelease] | @tsv"
          )
          if [[ "$RELEASE_SCOPE" == "macos" ]]; then
            if [[ "${#existing_releases[@]}" -ne 1 ]]; then
              echo "macOS supplementation requires exactly one existing Release for $tag" >&2
              exit 1
            fi
            IFS=$'\t' read -r release_id is_draft is_prerelease <<< "${existing_releases[0]}"
            test -n "$release_id"
            test "$is_draft" = "true"
            test "$is_prerelease" = "false"
          elif [[ "${#existing_releases[@]}" -ne 0 ]]; then
            echo "A GitHub Release already exists for $tag" >&2
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify project metadata and release tests
        shell: bash
        run: |
          set -euo pipefail
          root_version="$(node -p "require('./package.json').version")"
          desktop_version="$(node -p "require('./apps/desktop/package.json').version")"
          tauri_version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          cargo_version="$(awk '/^\[workspace.package\]$/ { section = 1; next } section && /^version = / { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)"
          test "$VERSION" = "$root_version"
          test "$VERSION" = "$desktop_version"
          test "$VERSION" = "$tauri_version"
          test "$VERSION" = "$cargo_version"
          node --test scripts/generate-app-release-manifest.test.mjs

  build-macos:
    name: Build macOS ARM64 Community DMG and online Runtimes
    if: inputs.release_scope == 'all' || inputs.release_scope == 'macos'
    needs: validate
    runs-on: macos-15
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      PUBLISHED_AT: ${{ inputs.published_at }}
      RUNTIME_CATALOG_SEQUENCE: ${{ inputs.runtime_catalog_sequence }}
      RUNTIME_CATALOG_EXPIRES_AT: ${{ inputs.runtime_catalog_expires_at }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - name: Check out the existing release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify ARM64 runner
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Install macOS Runtime build dependencies
        shell: bash
        run: |
          brew install \
            autoconf \
            bison \
            cmake \
            curl \
            freetype \
            gettext \
            gnupg \
            icu4c@78 \
            imagemagick \
            jpeg-turbo \
            libiconv \
            libpng \
            libxml2 \
            libsodium \
            libxslt \
            libzip \
            oniguruma \
            openssl@3 \
            pcre2 \
            pkgconf \
            re2c \
            readline \
            sevenzip \
            sqlite \
            tidy-html5 \
            xz \
            zlib

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build verified bundled macOS Runtimes
        shell: bash
        run: |
          ./scripts/build-macos-runtime-packages.sh \
            resources/runtime-packages/macos-arm64-bundled.json \
            "$GITHUB_WORKSPACE/artifacts" \
            dev

      - name: Build verified macOS online Runtimes
        shell: bash
        run: |
          ./scripts/build-macos-online-runtime-packages.sh \
            "$VERSION" \
            "$RUNTIME_CATALOG_SEQUENCE" \
            "$PUBLISHED_AT" \
            "$RUNTIME_CATALOG_EXPIRES_AT" \
            "$VERSION" \
            "$GITHUB_WORKSPACE/resources/runtime-packages/macos-arm64.json" \
            "$GITHUB_WORKSPACE/release-input/macos-runtimes"

      - name: Prepare Desktop sidecars
        run: node scripts/build-desktop-bundle-assets.mjs

      - name: Configure deterministic Swift lint
        shell: bash
        run: |
          printf '%s\n' \
            '{"rules":{"DontRepeatTypeInStaticProperties":false},"version":1}' \
            > helpers/macos/.swift-format

      - name: Run tests and lint
        shell: bash
        run: |
          pnpm test
          pnpm lint

      - name: Build unsigned Community DMG
        run: pnpm run build:community:macos

      - name: Stage macOS installer
        shell: bash
        run: |
          set -euo pipefail
          source_path="artifacts/fabDev-Community-$VERSION-macos-arm64.dmg"
          test -f "$source_path"
          test -s "$source_path"
          mkdir -p release-input/macos
          cp "$source_path" release-input/macos/macos-installer.dmg

      - name: Upload macOS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draft-macos-arm64
          path: release-input/macos/macos-installer.dmg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload macOS online Runtime assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draft-macos-online-runtimes
          path: release-input/macos-runtimes
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-windows:
    name: Build Windows x64 Community installer
    if: inputs.release_scope != 'macos'
    needs:
      - validate
      - build-windows-online-runtimes
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out the existing release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Windows online Runtime assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: draft-windows-online-runtimes
          path: release-input/runtimes

      - name: Run frontend tests
        run: pnpm -r --if-present test

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Prepare Desktop sidecars
        run: node scripts/build-desktop-bundle-assets.mjs

      - name: Prepare bundled Windows Runtimes
        shell: pwsh
        run: >-
          ./scripts/prepare-windows-runtimes.ps1
          -ManifestPath resources/runtime-packages/windows-x64-bundled.json

      - name: Build verified online PHP Runtime packages
        shell: pwsh
        run: >-
          ./scripts/build-windows-php-runtime.ps1
          -OutputDirectory release-input
          -ManifestPath resources/runtime-packages/windows-x64.json

      - name: Validate packaged Windows PHP Runtime installation
        env:
          FABDEV_WINDOWS_RUNTIME_PACKAGE_MANIFEST: ${{ github.workspace }}/resources/runtime-packages/windows-x64.json
          FABDEV_WINDOWS_RUNTIME_PACKAGE_DIR: ${{ github.workspace }}/release-input
        run: >-
          cargo test -p fabdev-runtime installs_real_windows_php_archive
          --target x86_64-pc-windows-msvc -- --ignored

      - name: Validate packaged Windows Node.js and MariaDB Runtime installation
        env:
          FABDEV_WINDOWS_RUNTIME_PACKAGE_MANIFEST: ${{ github.workspace }}/resources/runtime-packages/windows-x64.json
          FABDEV_WINDOWS_RUNTIME_PACKAGE_DIR: ${{ github.workspace }}/release-input/runtimes
        run: >-
          cargo test -p fabdev-agent installs_real_windows_online_service_runtime_archives
          --target x86_64-pc-windows-msvc -- --ignored

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-msvc

      - name: Build fabDev Connect
        run: cargo build -p fabdev-connect --release --target x86_64-pc-windows-msvc

      - name: Build unsigned NSIS installer
        run: pnpm --filter @fabdev/desktop exec tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows.conf.json

      - name: Stage Windows assets
        shell: pwsh
        run: |
          $installers = @(
            Get-ChildItem -Path "target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" -File
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }
          New-Item -ItemType Directory -Force -Path "release-input" | Out-Null
          Copy-Item $installers[0].FullName "release-input/windows-installer.exe"
          Copy-Item "target/x86_64-pc-windows-msvc/release/fabdev-connect.exe" "release-input/fabdev-connect.exe"

      - name: Upload Windows assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draft-windows-x64
          path: |
            release-input/windows-installer.exe
            release-input/fabdev-connect.exe
            release-input/php-*-windows-x64-community.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-windows-online-runtimes:
    name: Build verified Windows x64 Runtime packages
    if: inputs.release_scope != 'macos'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the existing release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build verified Runtime packages
        shell: bash
        env:
          FABDEV_BUILD_ROOT: ${{ runner.temp }}/windows-runtime-packages
          FABDEV_ARTIFACT_DIR: ${{ github.workspace }}/release-input/runtimes
          FABDEV_WINDOWS_RUNTIME_NAMES: mariadb node
          FABDEV_WINDOWS_PACKAGE_MANIFEST: ${{ github.workspace }}/resources/runtime-packages/windows-x64.json
        run: ./scripts/build-windows-runtime-packages.sh

      - name: Upload Runtime packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draft-windows-online-runtimes
          path: release-input/runtimes/*-windows-x64-community.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  create-draft:
    name: Create GitHub Draft Release
    needs:
      - validate
      - build-macos
      - build-windows
      - build-windows-online-runtimes
    if: >-
      ${{
        always() &&
        needs.validate.result == 'success' &&
        (
          (
            inputs.release_scope == 'macos' &&
            needs.build-macos.result == 'success' &&
            needs.build-windows.result == 'skipped' &&
            needs.build-windows-online-runtimes.result == 'skipped'
          ) ||
          (
            inputs.release_scope != 'macos' &&
            needs.build-windows.result == 'success' &&
            needs.build-windows-online-runtimes.result == 'success' &&
            (inputs.release_scope == 'windows' || needs.build-macos.result == 'success')
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_SCOPE: ${{ inputs.release_scope }}
      PUBLISHED_AT: ${{ inputs.published_at }}
      RUNTIME_CATALOG_SEQUENCE: ${{ inputs.runtime_catalog_sequence }}
      RUNTIME_CATALOG_EXPIRES_AT: ${{ inputs.runtime_catalog_expires_at }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the existing release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Download Windows assets
        if: inputs.release_scope != 'macos'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: draft-windows-x64
          path: release-input/windows

      - name: Download Windows online Runtime assets
        if: inputs.release_scope != 'macos'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: draft-windows-online-runtimes
          path: release-input/runtimes

      - name: Download macOS installer
        if: inputs.release_scope == 'all' || inputs.release_scope == 'macos'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: draft-macos-arm64
          path: release-input/macos

      - name: Download macOS online Runtime assets
        if: inputs.release_scope == 'all' || inputs.release_scope == 'macos'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: draft-macos-online-runtimes
          path: release-input/macos-runtimes

      - name: Download and validate existing Windows-only Draft assets
        if: inputs.release_scope == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          mkdir -p release-input/existing
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-input/existing
          (
            cd release-input/existing
            test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = "20"
            sha256sum --check SHA256SUMS
            test "$(find . -maxdepth 1 -type f -name '*.sha256' | wc -l | tr -d ' ')" = "8"
            for checksum in ./*.sha256; do
              sha256sum --check "$checksum"
            done
            cmp fabdev-app-v1.json fabdev-stable-v1.json
            test "$(jq '[.artifacts[] | select(.platform == "windows" and .architecture == "x64")] | length' fabdev-app-v1.json)" = "1"
            test "$(jq '[.artifacts[] | select(.platform != "windows")] | length' fabdev-app-v1.json)" = "0"
            test "$(jq '.catalogSequence' fabdev-runtime-v1.json)" = "$RUNTIME_CATALOG_SEQUENCE"
            test "$(jq '[.runtimes[] | select(.platform == "windows" and .architecture == "x64")] | length' fabdev-runtime-v1.json)" = "6"
            test "$(jq '[.runtimes[] | select(.platform != "windows")] | length' fabdev-runtime-v1.json)" = "0"
          )

      - name: Generate cross-platform release assets and manifests
        if: inputs.release_scope == 'all' || inputs.release_scope == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_SCOPE" == "macos" ]]; then
            windows_installer="$GITHUB_WORKSPACE/release-input/existing/fabDev-Community-$VERSION-windows-x64-setup.exe"
            windows_connect="$GITHUB_WORKSPACE/release-input/existing/fabDev-Connect-$VERSION-windows-x64.exe"
            windows_runtime_dir="$GITHUB_WORKSPACE/release-input/existing"
            runtime_args=(
              --runtime-package-dir "$GITHUB_WORKSPACE/release-input/macos-runtimes"
              --runtime-package-dir "$windows_runtime_dir"
            )
          else
            windows_installer="$GITHUB_WORKSPACE/release-input/windows/windows-installer.exe"
            windows_connect="$GITHUB_WORKSPACE/release-input/windows/fabdev-connect.exe"
            windows_runtime_dir="$GITHUB_WORKSPACE/release-input/windows"
            runtime_args=(
              --runtime-package-dir "$GITHUB_WORKSPACE/release-input/macos-runtimes"
              --runtime-package-dir "$windows_runtime_dir"
              --runtime-package-dir "$GITHUB_WORKSPACE/release-input/runtimes"
            )
          fi
          node scripts/generate-app-release-manifest.mjs \
            --version "$VERSION" \
            --published-at "$PUBLISHED_AT" \
            --output-dir "$GITHUB_WORKSPACE/release-assets" \
            --macos-arm64 "$GITHUB_WORKSPACE/release-input/macos/macos-installer.dmg" \
            --windows-x64 "$windows_installer" \
            --windows-connect-x64 "$windows_connect" \
            "${runtime_args[@]}"
          cargo run --locked -p fabdev-runtime --bin fabdev-runtime-catalog -- \
            generate-community \
            "$VERSION" \
            "$RUNTIME_CATALOG_SEQUENCE" \
            "$PUBLISHED_AT" \
            "$RUNTIME_CATALOG_EXPIRES_AT" \
            "$VERSION" \
            "$GITHUB_WORKSPACE/resources/runtime-packages/windows-x64.json" \
            "$GITHUB_WORKSPACE/release-assets" \
            "$GITHUB_WORKSPACE/resources/runtime-packages/macos-arm64.json" \
            "$GITHUB_WORKSPACE/release-assets" \
            "$GITHUB_WORKSPACE/release-assets/fabdev-runtime-v1.json"
          cargo run --locked -p fabdev-runtime --bin fabdev-runtime-catalog -- \
            validate \
            "$GITHUB_WORKSPACE/release-assets/fabdev-runtime-v1.json" \
            "$VERSION"
          (
            cd release-assets
            sha256sum --check SHA256SUMS
            checksum_entries="$(awk 'NF { count += 1 } END { print count + 0 }' SHA256SUMS)"
            expected_file_count="$((checksum_entries * 2 + 4))"
            test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = "$expected_file_count"
            test "$checksum_entries" = "13"
            test "$(jq '[.artifacts[] | select(.platform == "windows" and .architecture == "x64")] | length' fabdev-app-v1.json)" = "1"
            test "$(jq '[.artifacts[] | select(.platform == "macos" and .architecture == "arm64")] | length' fabdev-app-v1.json)" = "1"
            test "$(jq '[.runtimes[] | select(.platform == "windows" and .architecture == "x64")] | length' fabdev-runtime-v1.json)" = "6"
            test "$(jq '[.runtimes[] | select(.platform == "macos" and .architecture == "arm64")] | length' fabdev-runtime-v1.json)" = "4"
          )

      - name: Generate Windows-only release assets and manifests
        if: inputs.release_scope == 'windows'
        shell: bash
        run: |
          node scripts/generate-app-release-manifest.mjs \
            --version "$VERSION" \
            --published-at "$PUBLISHED_AT" \
            --output-dir "$GITHUB_WORKSPACE/release-assets" \
            --windows-x64 "$GITHUB_WORKSPACE/release-input/windows/windows-installer.exe" \
            --windows-connect-x64 "$GITHUB_WORKSPACE/release-input/windows/fabdev-connect.exe" \
            --runtime-package-dir "$GITHUB_WORKSPACE/release-input/windows" \
            --runtime-package-dir "$GITHUB_WORKSPACE/release-input/runtimes"
          cargo run --locked -p fabdev-runtime --bin fabdev-runtime-catalog -- \
            generate-windows \
            "$VERSION" \
            "$RUNTIME_CATALOG_SEQUENCE" \
            "$PUBLISHED_AT" \
            "$RUNTIME_CATALOG_EXPIRES_AT" \
            "$VERSION" \
            "$GITHUB_WORKSPACE/resources/runtime-packages/windows-x64.json" \
            "$GITHUB_WORKSPACE/release-assets" \
            "$GITHUB_WORKSPACE/release-assets/fabdev-runtime-v1.json"
          cargo run --locked -p fabdev-runtime --bin fabdev-runtime-catalog -- \
            validate \
            "$GITHUB_WORKSPACE/release-assets/fabdev-runtime-v1.json" \
            "$VERSION"
          (
            cd release-assets
            sha256sum --check SHA256SUMS
            checksum_entries="$(awk 'NF { count += 1 } END { print count + 0 }' SHA256SUMS)"
            expected_file_count="$((checksum_entries * 2 + 4))"
            test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = "$expected_file_count"
            test "$(jq '[.artifacts[] | select(.platform == "windows" and .architecture == "x64")] | length' fabdev-app-v1.json)" = "1"
            test "$(jq '[.artifacts[] | select(.platform != "windows")] | length' fabdev-app-v1.json)" = "0"
            test "$(jq '[.runtimes[] | select(.platform == "windows" and .architecture == "x64")] | length' fabdev-runtime-v1.json)" = "6"
            test "$(jq '[.runtimes[] | select(.platform != "windows")] | length' fabdev-runtime-v1.json)" = "0"
          )

      - name: Create cross-platform release notes skeleton
        if: inputs.release_scope == 'all'
        shell: bash
        run: |
          {
            printf '# fabDev %s\n\n' "$VERSION"
            printf '> Draft only - do not publish before release asset validation.\n\n'
            printf '## Unsigned Community Build\n\n'
            printf 'This build does not use Apple Developer ID, notarization, or Windows Code Signing.\n\n'
            printf 'Verify the downloaded installer against SHA256SUMS before installation.\n\n'
            printf '## Release checklist\n\n'
            printf -- '- [ ] Complete release notes and known limitations.\n'
            printf -- '- [x] Complete automated macOS ARM64 and Windows x64 build and test validation.\n'
            printf -- '- [ ] Validate the changed Windows in-app update and download cancellation flow on the Windows VM.\n'
            printf -- '- [x] Reuse prior macOS install, startup, and removal acceptance; macOS packaging behavior is unchanged.\n'
            printf -- '- [ ] Re-download every Draft asset and verify size and SHA-256.\n'
            printf -- '- [ ] Validate both platform manifests, Runtime Archives, Runtime Catalog v1, and public asset boundaries.\n'
            printf -- '- [ ] Obtain explicit Repository Owner approval before Publish.\n'
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create Windows-only release notes skeleton
        if: inputs.release_scope == 'windows'
        shell: bash
        run: |
          {
            printf '# fabDev %s\n\n' "$VERSION"
            printf '> Draft only - do not publish before release asset validation.\n\n'
            printf '## Unsigned Community Build\n\n'
            printf 'This Windows-only build does not use Windows Code Signing.\n\n'
            printf 'Verify the downloaded installer against SHA256SUMS before installation.\n\n'
            printf '## Release checklist\n\n'
            printf -- '- [ ] Complete release notes and known limitations.\n'
            printf -- '- [x] Complete automated Windows x64 build and test validation.\n'
            printf -- '- [x] Reuse the Repository Owner Windows installer language and single-instance acceptance.\n'
            printf -- '- [ ] Re-download every Draft asset and verify size and SHA-256.\n'
            printf -- '- [ ] Validate the Windows-only App Manifest, Runtime Archives, Runtime Catalog v1, and public asset boundaries.\n'
            printf -- '- [ ] Obtain explicit Repository Owner approval before Publish.\n'
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create supplemented cross-platform release notes skeleton
        if: inputs.release_scope == 'macos'
        shell: bash
        run: |
          {
            printf '# fabDev %s\n\n' "$VERSION"
            printf '> Draft only - do not publish before release asset validation.\n\n'
            printf '## Unsigned Community Build\n\n'
            printf 'This build uses the existing ad-hoc macOS signing only. It does not use Apple Developer ID, notarization, stapling, Hardened Runtime, or Windows Code Signing.\n\n'
            printf 'Verify the downloaded installers against SHA256SUMS before installation.\n\n'
            printf '## Release checklist\n\n'
            printf -- '- [ ] Complete release notes and known limitations.\n'
            printf -- '- [x] Reuse the validated Windows x64 Draft assets without rebuilding Windows.\n'
            printf -- '- [x] Complete automated macOS ARM64 build, Runtime, lint, and packaging validation.\n'
            printf -- '- [x] Reuse the Repository Owner Windows installer language, single-instance, and version acceptance.\n'
            printf -- '- [x] Reuse prior macOS install, startup, and removal acceptance; macOS packaging behavior is unchanged.\n'
            printf -- '- [ ] Re-download every supplemented Draft asset and verify size and SHA-256.\n'
            printf -- '- [ ] Validate both platform manifests, Runtime Archives, Runtime Catalog v1, and Draft asset boundaries.\n'
            printf -- '- [ ] Obtain explicit Repository Owner approval before Publish.\n'
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create or supplement Draft Release
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          mapfile -t existing_release_ids < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$tag\") | .id"
          )
          if [[ "$RELEASE_SCOPE" == "macos" ]]; then
            test "${#existing_release_ids[@]}" = "1"
            existing_release_id="${existing_release_ids[0]}"
            mkdir -p supplement-assets
            cp \
              release-assets/SHA256SUMS \
              release-assets/fabdev-app-v1.json \
              release-assets/fabdev-runtime-v1.json \
              release-assets/fabdev-stable-v1.json \
              supplement-assets/
            find release-assets -maxdepth 1 -type f -name '*-macos-arm64*' \
              -exec cp {} supplement-assets/ \;
            test "$(find supplement-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = "14"
            gh release upload "$tag" supplement-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/releases/$existing_release_id" \
              -F "body=@$RUNNER_TEMP/release-notes.md" \
              >/dev/null
          else
            if [[ "${#existing_release_ids[@]}" -ne 0 ]]; then
              echo "A GitHub Release already exists for $tag" >&2
              exit 1
            fi
            gh release create "$tag" "$GITHUB_WORKSPACE/release-assets/"* \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --latest=false \
              --title "fabDev $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          test "$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$tag\") | .draft"
          )" = "true"
          if [[ "$RELEASE_SCOPE" == "macos" ]]; then
            test "$(
              gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq ".[] | select(.tag_name == \"$tag\") | (.published_at == null)"
            )" = "true"
            test "$(
              gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                --jq ".[] | select(.tag_name == \"$tag\") | (.assets | length)"
            )" = "30"
            mkdir -p post-upload
            gh release download "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --dir post-upload
            test "$(find post-upload -maxdepth 1 -type f | wc -l | tr -d ' ')" = "30"
            for expected in release-assets/*; do
              cmp "$expected" "post-upload/$(basename "$expected")"
            done
            (
              cd post-upload
              sha256sum --check SHA256SUMS
              for checksum in ./*.sha256; do
                sha256sum --check "$checksum"
              done
              cmp fabdev-app-v1.json fabdev-stable-v1.json
            )
          fi
