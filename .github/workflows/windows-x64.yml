name: Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-x64.yml"
      - "apps/desktop/**"
      - "crates/**"
      - "packages/**"
      - "resources/runtime-packages/windows-x64*.json"
      - "scripts/build-desktop-bundle-assets.mjs"
      - "scripts/generate-app-release-manifest.test.mjs"
      - "scripts/prepare-windows-runtimes.ps1"
      - "Cargo.lock"
      - "Cargo.toml"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  check:
    name: Check Windows MSVC
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x64
          cache-on-failure: true

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run frontend tests
        run: pnpm -r --if-present test

      - name: Run Windows distribution contract tests
        run: pnpm run test:release

      - name: Prepare Desktop sidecars
        run: node scripts/build-desktop-bundle-assets.mjs

      - name: Prepare bundled Windows Runtimes
        shell: pwsh
        run: >-
          ./scripts/prepare-windows-runtimes.ps1
          -ManifestPath resources/runtime-packages/windows-x64-bundled.json

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-msvc

      - name: Build fabDev Connect
        run: cargo build -p fabdev-connect --release --target x86_64-pc-windows-msvc

      - name: Build unsigned NSIS installer
        run: pnpm --filter @fabdev/desktop exec tauri build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows.conf.json

      - name: Upload fabDev Connect
        uses: actions/upload-artifact@v4
        with:
          name: fabDev-Connect-Windows-x64
          path: target/x86_64-pc-windows-msvc/release/fabdev-connect.exe
          if-no-files-found: error

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: fabDev-Community-Windows-x64
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
