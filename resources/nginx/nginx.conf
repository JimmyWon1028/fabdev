worker_processes 1;
error_log "@FABDEV_ROOT@/logs/nginx-error.log" notice;
pid "@FABDEV_ROOT@/services/nginx/nginx.pid";

events {
  worker_connections 1024;
}

http {
  include "@NGINX_ROOT@/conf/mime.types";
  default_type application/octet-stream;
  server_names_hash_bucket_size 512;
  log_format fabdev_timing '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'request_time=$request_time upstream_response_time=$upstream_response_time';
  access_log "@FABDEV_ROOT@/logs/nginx-access.log" fabdev_timing;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 128m;

  server {
    listen 127.0.0.1:@HTTP_PORT@ default_server;
    server_name _;
    add_header X-fabDev-Default 1 always;
    return 404;
  }

  server {
    listen 127.0.0.1:@HTTPS_PORT@ ssl default_server;
    ssl_reject_handshake on;
  }

  include "@FABDEV_ROOT@/sites/*.conf";
}
