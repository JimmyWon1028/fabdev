[www]
listen = @SERVICE_ROOT@/php-fpm.sock
listen.mode = 0660
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
pm.status_path = /__fabdev/php-fpm-status
request_slowlog_timeout = 10s
slowlog = @SERVICE_ROOT@/logs/php-slow.log
request_terminate_timeout = 120s
catch_workers_output = yes
clear_env = no
php_admin_value[mysqli.default_socket] = @MARIADB_SOCKET@
php_admin_value[pdo_mysql.default_socket] = @MARIADB_SOCKET@
