[PHP]
engine = On
short_open_tag = Off
precision = 14
pcre.jit = 0
output_buffering = 4096
serialize_precision = -1
max_execution_time = 60
max_input_time = 120
max_input_vars = 99999
memory_limit = 128M
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
error_log = "@SERVICE_ROOT@/logs/php-error.log"
post_max_size = 64M
upload_max_filesize = 64M
max_file_uploads = 20
default_charset = "UTF-8"

[Date]
date.timezone = "Asia/Taipei"

[Session]
session.save_handler = files
session.save_path = "@SERVICE_ROOT@/session"

[Extensions]
zend_extension = "@RUNTIME_ROOT@/lib/php/extensions/@PHP_EXTENSION_API@/opcache.so"
extension = "@RUNTIME_ROOT@/lib/php/extensions/@PHP_EXTENSION_API@/imagick.so"
extension = "@RUNTIME_ROOT@/lib/php/extensions/@PHP_EXTENSION_API@/imap.so"

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
